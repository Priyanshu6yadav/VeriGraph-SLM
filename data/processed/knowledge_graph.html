                  edges = new vis.DataSet([{"arrows": "to", "color": {"color": "#94A3B8", "highlight": "#F59E0B"}, "evidence_json": "[{\"source\": \"attention is you need.pdf\", \"page_number\": 1, \"chunk_id\": \"page_1_chunk_1\", \"evidence_text\": \"oogle Research\\nllion@google.com\\nAidan N. Gomez\u2217\u2020\\nUniversity of Toronto\\naidan@cs.toronto.edu\\n\u0141ukasz Kaiser\u2217\\nGoogle Brain\\nlukaszkaiser@google.com\\nIllia Polosukhin\u2217\u2021\\nillia.polosukhin@gmail.com\\nAbstract\\nThe dominant sequence transduction models are based on complex recurrent or\\nconvolutional neural networks that include an encoder and a decoder. The best\\nperforming models also connect the encoder and decoder through an attention\\nmechanism. We propose a new simple network architecture, the Transforme\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 1, \"chunk_id\": \"page_1_chunk_2\", \"evidence_text\": \"decoder through an attention\\nmechanism. We propose a new simple network architecture, the Transformer,\\nbased solely on attention mechanisms, dispensing with recurrence and convolutions\\nentirely. Experiments on two machine translation tasks show these models to\\nbe superior in quality while being more parallelizable and requiring significantly\\nless time to train. Our model achieves 28.4 BLEU on the WMT 2014 English-\\nto-German translation task, improving over the existing best results, including\\nen\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 1, \"chunk_id\": \"page_1_chunk_4\", \"evidence_text\": \"rmer generalizes well to\\nother tasks by applying it successfully to English constituency parsing both with\\nlarge and limited training data.\\n\u2217Equal contribution. Listing order is random. Jakob proposed replacing RNNs with self-attention and started\\nthe effort to evaluate this idea. Ashish, with Illia, designed and implemented the first Transformer models and\\nhas been crucially involved in every aspect of this work. Noam proposed scaled dot-product attention, multi-head\\nattention and the parameter\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 1, \"chunk_id\": \"page_1_chunk_7\", \"evidence_text\": \"g Beach, CA, USA.\\narXiv:1706.03762v7 [cs.CL] 2 Aug 2023\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 2, \"chunk_id\": \"page_2_chunk_2\", \"evidence_text\": \"s, which becomes critical at longer\\nsequence lengths, as memory constraints limit batching across examples. Recent work has achieved\\nsignificant improvements in computational efficiency through factorization tricks [21] and conditional\\ncomputation [32], while also improving model performance in case of the latter. The fundamental\\nconstraint of sequential computation, however, remains.\\nAttention mechanisms have become an integral part of compelling sequence modeling and transduc-\\ntion models in v\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 2, \"chunk_id\": \"page_2_chunk_3\", \"evidence_text\": \"chanisms have become an integral part of compelling sequence modeling and transduc-\\ntion models in various tasks, allowing modeling of dependencies without regard to their distance in\\nthe input or output sequences [2, 19]. In all but a few cases [27], however, such attention mechanisms\\nare used in conjunction with a recurrent network.\\nIn this work we propose the Transformer, a model architecture eschewing recurrence and instead\\nrelying entirely on an attention mechanism to draw global dependenci\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 2, \"chunk_id\": \"page_2_chunk_4\", \"evidence_text\": \"schewing recurrence and instead\\nrelying entirely on an attention mechanism to draw global dependencies between input and output.\\nThe Transformer allows for significantly more parallelization and can reach a new state of the art in\\ntranslation quality after being trained for as little as twelve hours on eight P100 GPUs.\\n2\\nBackground\\nThe goal of reducing sequential computation also forms the foundation of the Extended Neural GPU\\n[16], ByteNet [18] and ConvS2S [9], all of which use convolutional ne\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 2, \"chunk_id\": \"page_2_chunk_7\", \"evidence_text\": \"ttention is an attention mechanism relating different positions\\nof a single sequence in order to compute a representation of the sequence. Self-attention has been\\nused successfully in a variety of tasks including reading comprehension, abstractive summarization,\\ntextual entailment and learning task-independent sentence representations [4, 27, 28, 22].\\nEnd-to-end memory networks are based on a recurrent attention mechanism instead of sequence-\\naligned recurrence and have been shown to perform wel\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 2, \"chunk_id\": \"page_2_chunk_8\", \"evidence_text\": \"rrent attention mechanism instead of sequence-\\naligned recurrence and have been shown to perform well on simple-language question answering and\\nlanguage modeling tasks [34].\\nTo the best of our knowledge, however, the Transformer is the first transduction model relying\\nentirely on self-attention to compute representations of its input and output without using sequence-\\naligned RNNs or convolution. In the following sections, we will describe the Transformer, motivate\\nself-attention and discuss its\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 2, \"chunk_id\": \"page_2_chunk_9\", \"evidence_text\": \"In the following sections, we will describe the Transformer, motivate\\nself-attention and discuss its advantages over models such as [17, 18] and [9].\\n3\\nModel Architecture\\nMost competitive neural sequence transduction models have an encoder-decoder structure [5, 2, 35].\\nHere, the encoder maps an input sequence of symbol representations (x1, ..., xn) to a sequence\\nof continuous representations z = (z1, ..., zn). Given z, the decoder then generates an output\\nsequence (y1, ..., ym) of symbols one el\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 3, \"chunk_id\": \"page_3_chunk_0\", \"evidence_text\": \"Figure 1: The Transformer - model architecture.\\nThe Transformer follows this overall architecture using stacked self-attention and point-wise, fully\\nconnected layers for both the encoder and decoder, shown in the left and right halves of Figure 1,\\nrespectively.\\n3.1\\nEncoder and Decoder Stacks\\nEncoder:\\nThe encoder is composed of a stack of N = 6 identical layers. Each layer has two\\nsub-layers. The first is a multi-head self-attention mechanism, and the second is a simple, position-\\nwise fully conn\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 3, \"chunk_id\": \"page_3_chunk_2\", \"evidence_text\": \"idual connections, all sub-layers in the model, as well as the embedding\\nlayers, produce outputs of dimension dmodel = 512.\\nDecoder:\\nThe decoder is also composed of a stack of N = 6 identical layers. In addition to the two\\nsub-layers in each encoder layer, the decoder inserts a third sub-layer, which performs multi-head\\nattention over the output of the encoder stack. Similar to the encoder, we employ residual connections\\naround each of the sub-layers, followed by layer normalization. We also mod\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 4, \"chunk_id\": \"page_4_chunk_3\", \"evidence_text\": \"a feed-forward network with\\na single hidden layer. While the two are similar in theoretical complexity, dot-product attention is\\nmuch faster and more space-efficient in practice, since it can be implemented using highly optimized\\nmatrix multiplication code.\\nWhile for small values of dk the two mechanisms perform similarly, additive attention outperforms\\ndot product attention without scaling for larger values of dk [3]. We suspect that for large values of\\ndk, the dot products grow large in magnit\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 4, \"chunk_id\": \"page_4_chunk_5\", \"evidence_text\": \"al to linearly project the queries, keys and values h times with different, learned\\nlinear projections to dk, dk and dv dimensions, respectively. On each of these projected versions of\\nqueries, keys and values we then perform the attention function in parallel, yielding dv-dimensional\\n4To illustrate why the dot products get large, assume that the components of q and k are independent random\\nvariables with mean 0 and variance 1. Then their dot product, q \u00b7 k = Pdk\\ni=1 qiki, has mean 0 and varianc\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 5, \"chunk_id\": \"page_5_chunk_3\", \"evidence_text\": \"ttention mechanisms in sequence-to-sequence models such as\\n[38, 2, 9].\\n\u2022 The encoder contains self-attention layers. In a self-attention layer all of the keys, values\\nand queries come from the same place, in this case, the output of the previous layer in the\\nencoder. Each position in the encoder can attend to all positions in the previous layer of the\\nencoder.\\n\u2022 Similarly, self-attention layers in the decoder allow each position in the decoder to attend to\\nall positions in the decoder up to and \"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 5, \"chunk_id\": \"page_5_chunk_6\", \"evidence_text\": \"same across different positions, they use different parameters\\nfrom layer to layer. Another way of describing this is as two convolutions with kernel size 1.\\nThe dimensionality of input and output is dmodel = 512, and the inner-layer has dimensionality\\ndff = 2048.\\n3.4\\nEmbeddings and Softmax\\nSimilarly to other sequence transduction models, we use learned embeddings to convert the input\\ntokens and output tokens to vectors of dimension dmodel. We also use the usual learned linear transfor-\\nmation a\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 5, \"chunk_id\": \"page_5_chunk_7\", \"evidence_text\": \"utput tokens to vectors of dimension dmodel. We also use the usual learned linear transfor-\\nmation and softmax function to convert the decoder output to predicted next-token probabilities. In\\nour model, we share the same weight matrix between the two embedding layers and the pre-softmax\\nlinear transformation, similar to [30]. In the embedding layers, we multiply those weights by \u221admodel.\\n5\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 6, \"chunk_id\": \"page_6_chunk_4\", \"evidence_text\": \"r function of\\nPEpos.\\nWe also experimented with using learned positional embeddings [9] instead, and found that the two\\nversions produced nearly identical results (see Table 3 row (E)). We chose the sinusoidal version\\nbecause it may allow the model to extrapolate to sequence lengths longer than the ones encountered\\nduring training.\\n4\\nWhy Self-Attention\\nIn this section we compare various aspects of self-attention layers to the recurrent and convolu-\\ntional layers commonly used for mapping one vari\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 6, \"chunk_id\": \"page_6_chunk_8\", \"evidence_text\": \"tention layer connects all positions with a constant number of sequentially\\nexecuted operations, whereas a recurrent layer requires O(n) sequential operations. In terms of\\ncomputational complexity, self-attention layers are faster than recurrent layers when the sequence\\n6\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 7, \"chunk_id\": \"page_7_chunk_0\", \"evidence_text\": \"length n is smaller than the representation dimensionality d, which is most often the case with\\nsentence representations used by state-of-the-art models in machine translations, such as word-piece\\n[38] and byte-pair [31] representations. To improve computational performance for tasks involving\\nvery long sequences, self-attention could be restricted to considering only a neighborhood of size r in\\nthe input sequence centered around the respective output position. This would increase the maximum\\npa\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 7, \"chunk_id\": \"page_7_chunk_3\", \"evidence_text\": \"e combination of a self-attention layer and a point-wise feed-forward layer,\\nthe approach we take in our model.\\nAs side benefit, self-attention could yield more interpretable models. We inspect attention distributions\\nfrom our models and present and discuss examples in the appendix. Not only do individual attention\\nheads clearly learn to perform different tasks, many appear to exhibit behavior related to the syntactic\\nand semantic structure of the sentences.\\n5\\nTraining\\nThis section describes the\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 7, \"chunk_id\": \"page_7_chunk_5\", \"evidence_text\": \"ish-French, we used the significantly larger WMT\\n2014 English-French dataset consisting of 36M sentences and split tokens into a 32000 word-piece\\nvocabulary [38]. Sentence pairs were batched together by approximate sequence length. Each training\\nbatch contained a set of sentence pairs containing approximately 25000 source tokens and 25000\\ntarget tokens.\\n5.2\\nHardware and Schedule\\nWe trained our models on one machine with 8 NVIDIA P100 GPUs. For our base models using\\nthe hyperparameters described \"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 7, \"chunk_id\": \"page_7_chunk_8\", \"evidence_text\": \" step number. We used\\nwarmup_steps = 4000.\\n5.4\\nRegularization\\nWe employ three types of regularization during training:\\n7\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 8, \"chunk_id\": \"page_8_chunk_1\", \"evidence_text\": \"0\\nMoE [32]\\n26.03\\n40.56\\n2.0 \u00b7 1019\\n1.2 \u00b7 1020\\nDeep-Att + PosUnk Ensemble [39]\\n40.4\\n8.0 \u00b7 1020\\nGNMT + RL Ensemble [38]\\n26.30\\n41.16\\n1.8 \u00b7 1020\\n1.1 \u00b7 1021\\nConvS2S Ensemble [9]\\n26.36\\n41.29\\n7.7 \u00b7 1019\\n1.2 \u00b7 1021\\nTransformer (base model)\\n27.3\\n38.1\\n3.3 \u00b7 1018\\nTransformer (big)\\n28.4\\n41.8\\n2.3 \u00b7 1019\\nResidual Dropout\\nWe apply dropout [33] to the output of each sub-layer, before it is added to the\\nsub-layer input and normalized. In addition, we apply dropout to the sums of the embeddings and the\\npositional \"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 8, \"chunk_id\": \"page_8_chunk_2\", \"evidence_text\": \"nput and normalized. In addition, we apply dropout to the sums of the embeddings and the\\npositional encodings in both the encoder and decoder stacks. For the base model, we use a rate of\\nPdrop = 0.1.\\nLabel Smoothing\\nDuring training, we employed label smoothing of value \u03f5ls = 0.1 [36]. This\\nhurts perplexity, as the model learns to be more unsure, but improves accuracy and BLEU score.\\n6\\nResults\\n6.1\\nMachine Translation\\nOn the WMT 2014 English-to-German translation task, the big transformer model (T\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 8, \"chunk_id\": \"page_8_chunk_7\", \"evidence_text\": \" and an estimate of the sustained\\nsingle-precision floating-point capacity of each GPU 5.\\n6.2\\nModel Variations\\nTo evaluate the importance of different components of the Transformer, we varied our base model\\nin different ways, measuring the change in performance on English-to-German translation on the\\n5We used values of 2.8, 3.7, 6.0 and 9.5 TFLOPS for K80, K40, M40 and P100, respectively.\\n8\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 9, \"chunk_id\": \"page_9_chunk_0\", \"evidence_text\": \"Table 3: Variations on the Transformer architecture. Unlisted values are identical to those of the base\\nmodel. All metrics are on the English-to-German translation development set, newstest2013. Listed\\nperplexities are per-wordpiece, according to our byte-pair encoding, and should not be compared to\\nper-word perplexities.\\nN\\ndmodel\\ndff\\nh\\ndk\\ndv\\nPdrop\\n\u03f5ls\\ntrain\\nPPL\\nBLEU\\nparams\\nsteps\\n(dev)\\n(dev)\\n\u00d7106\\nbase\\n6\\n512\\n2048\\n8\\n64\\n64\\n0.1\\n0.1\\n100K\\n4.92\\n25.8\\n65\\n(A)\\n1\\n512\\n512\\n5.29\\n24.9\\n4\\n128\\n128\\n5.00\\n25.5\\n16\\n32\\n\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 9, \"chunk_id\": \"page_9_chunk_1\", \"evidence_text\": \"base\\n6\\n512\\n2048\\n8\\n64\\n64\\n0.1\\n0.1\\n100K\\n4.92\\n25.8\\n65\\n(A)\\n1\\n512\\n512\\n5.29\\n24.9\\n4\\n128\\n128\\n5.00\\n25.5\\n16\\n32\\n32\\n4.91\\n25.8\\n32\\n16\\n16\\n5.01\\n25.4\\n(B)\\n16\\n5.16\\n25.1\\n58\\n32\\n5.01\\n25.4\\n60\\n(C)\\n2\\n6.11\\n23.7\\n36\\n4\\n5.19\\n25.3\\n50\\n8\\n4.88\\n25.5\\n80\\n256\\n32\\n32\\n5.75\\n24.5\\n28\\n1024\\n128\\n128\\n4.66\\n26.0\\n168\\n1024\\n5.12\\n25.4\\n53\\n4096\\n4.75\\n26.2\\n90\\n(D)\\n0.0\\n5.77\\n24.6\\n0.2\\n4.95\\n25.5\\n0.0\\n4.67\\n25.3\\n0.2\\n5.47\\n25.7\\n(E)\\npositional embedding instead of sinusoids\\n4.92\\n25.7\\nbig\\n6\\n1024\\n4096\\n16\\n0.3\\n300K\\n4.33\\n26.4\\n213\\ndevelopment set, newstest2013. We used \"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 9, \"chunk_id\": \"page_9_chunk_7\", \"evidence_text\": \"ing rates and beam size on the Section 22 development set, all other parameters\\nremained unchanged from the English-to-German base translation model. During inference, we\\n9\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 10, \"chunk_id\": \"page_10_chunk_0\", \"evidence_text\": \"Table 4: The Transformer generalizes well to English constituency parsing (Results are on Section 23\\nof WSJ)\\nParser\\nTraining\\nWSJ 23 F1\\nVinyals \u0026 Kaiser el al. (2014) [37]\\nWSJ only, discriminative\\n88.3\\nPetrov et al. (2006) [29]\\nWSJ only, discriminative\\n90.4\\nZhu et al. (2013) [40]\\nWSJ only, discriminative\\n90.4\\nDyer et al. (2016) [8]\\nWSJ only, discriminative\\n91.7\\nTransformer (4 layers)\\nWSJ only, discriminative\\n91.3\\nZhu et al. (2013) [40]\\nsemi-supervised\\n91.3\\nHuang \u0026 Harper (2009) [14]\\nsemi-supervis\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 10, \"chunk_id\": \"page_10_chunk_1\", \"evidence_text\": \"riminative\\n91.3\\nZhu et al. (2013) [40]\\nsemi-supervised\\n91.3\\nHuang \u0026 Harper (2009) [14]\\nsemi-supervised\\n91.3\\nMcClosky et al. (2006) [26]\\nsemi-supervised\\n92.1\\nVinyals \u0026 Kaiser el al. (2014) [37]\\nsemi-supervised\\n92.1\\nTransformer (4 layers)\\nsemi-supervised\\n92.7\\nLuong et al. (2015) [23]\\nmulti-task\\n93.0\\nDyer et al. (2016) [8]\\ngenerative\\n93.3\\nincreased the maximum output length to input length + 300. We used a beam size of 21 and \u03b1 = 0.3\\nfor both WSJ only and the semi-supervised setting.\\nOur results in\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 10, \"chunk_id\": \"page_10_chunk_3\", \"evidence_text\": \"orms the Berkeley-\\nParser [29] even when training only on the WSJ training set of 40K sentences.\\n7\\nConclusion\\nIn this work, we presented the Transformer, the first sequence transduction model based entirely on\\nattention, replacing the recurrent layers most commonly used in encoder-decoder architectures with\\nmulti-headed self-attention.\\nFor translation tasks, the Transformer can be trained significantly faster than architectures based\\non recurrent or convolutional layers. On both WMT 2014 English\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 10, \"chunk_id\": \"page_10_chunk_4\", \"evidence_text\": \"antly faster than architectures based\\non recurrent or convolutional layers. On both WMT 2014 English-to-German and WMT 2014\\nEnglish-to-French translation tasks, we achieve a new state of the art. In the former task our best\\nmodel outperforms even all previously reported ensembles.\\nWe are excited about the future of attention-based models and plan to apply them to other tasks. We\\nplan to extend the Transformer to problems involving input and output modalities other than text and\\nto investigate lo\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 10, \"chunk_id\": \"page_10_chunk_5\", \"evidence_text\": \" Transformer to problems involving input and output modalities other than text and\\nto investigate local, restricted attention mechanisms to efficiently handle large inputs and outputs\\nsuch as images, audio and video. Making generation less sequential is another research goals of ours.\\nThe code we used to train and evaluate our models is available at https://github.com/\\ntensorflow/tensor2tensor.\\nAcknowledgements\\nWe are grateful to Nal Kalchbrenner and Stephan Gouws for their fruitful\\ncomments, co\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 10, \"chunk_id\": \"page_10_chunk_7\", \"evidence_text\": \"473, 2014.\\n[3] Denny Britz, Anna Goldie, Minh-Thang Luong, and Quoc V. Le. Massive exploration of neural\\nmachine translation architectures. CoRR, abs/1703.03906, 2017.\\n[4] Jianpeng Cheng, Li Dong, and Mirella Lapata. Long short-term memory-networks for machine\\nreading. arXiv preprint arXiv:1601.06733, 2016.\\n10\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 11, \"chunk_id\": \"page_11_chunk_0\", \"evidence_text\": \"[5] Kyunghyun Cho, Bart van Merrienboer, Caglar Gulcehre, Fethi Bougares, Holger Schwenk,\\nand Yoshua Bengio. Learning phrase representations using rnn encoder-decoder for statistical\\nmachine translation. CoRR, abs/1406.1078, 2014.\\n[6] Francois Chollet. Xception: Deep learning with depthwise separable convolutions. arXiv\\npreprint arXiv:1610.02357, 2016.\\n[7] Junyoung Chung, \u00c7aglar G\u00fcl\u00e7ehre, Kyunghyun Cho, and Yoshua Bengio. Empirical evaluation\\nof gated recurrent neural networks on sequence modeli\"}, {\"source\": \"attention is you need.pdf\", \"page_number\": 11, \"chunk_id\": \"page_11_chunk_1\", \"evidence_text\": \"n Cho, and Yoshua Bengio. Empirical evaluatio     <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: #F8FAFC;
        }

        #toolbar {
            padding: 12px;
            display: flex;
            gap: 10px;
            background: #172338;
            align-items: center;
            flex-wrap: wrap;
        }

        #searchBox {
            width: 260px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #64748B;
            background: #0F172A;
            color: white;
        }

        button {
            padding: 10px 14px;
            border: 0;
            border-radius: 6px;
            background: #2563EB;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1D4ED8;
        }

        #status {
            color: #CBD5E1;
            font-size: 13px;
        }

        #details {
            padding: 18px;
            background: #172338;
            border-top: 1px solid #334155;
            min-height: 150px;
        }

        #details h2 {
            color: #93C5FD;
            margin-top: 0;
        }

        .evidence-card {
            background: #0F172A;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 14px;
            margin: 12px 0;
        }

        .evidence-card h3 {
            color: #FBBF24;
            margin-top: 0;
            font-size: 16px;
        }

        .evidence-meta {
            color: #93C5FD;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .evidence-text {
            color: #E2E8F0;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .empty-message {
            color: #CBD5E1;
        }

        #mynetwork {
            background: #101827;
        }
    </style>

    <div id="toolbar">
        <input
            id="searchBox"
            type="text"
            placeholder="Search entity, e.g. Transformer"
        />

        <button onclick="searchEntity()">Search</button>
        <button onclick="resetGraph()">Reset Graph</button>

        <span id="status">
            Select a node or relationship.
        </span>
    </div>

    <div id="details">
        <h2>Evidence Inspector</h2>
        <p class="empty-message">
            Click a relationship edge to inspect its supporting
            document passages.
        </p>
    </div>

    <script>

        // Safely display text in the evidence panel
        function addText(parent, tag, text, className) {

            const element = document.createElement(tag);

            element.textContent = text;

            if (className) {
                element.className = className;
            }

            parent.appendChild(element);

            return element;
        }


        // Display an entity
        function showEntity(nodeId) {

            const node = nodes.get(nodeId);

            const connected = network.getConnectedNodes(nodeId);

            const panel = document.getElementById("details");

            panel.replaceChildren();

            addText(
                panel,
                "h2",
                "Entity: " + node.label
            );

            addText(
                panel,
                "p",
                "Number of connected entities: " + connected.length
            );

            addText(
                panel,
                "h3",
                "Connected entities"
            );

            if (connected.length === 0) {

                addText(
                    panel,
                    "p",
                    "No connected entities found.",
                    "empty-message"
                );

            } else {

                connected.forEach(id => {

                    const connectedNode = nodes.get(id);

                    addText(
                        panel,
                        "p",
                        connectedNode.label
                    );

                });

            }
        }


        // Display all evidence for a selected relationship
        function showRelationship(edge) {

            const panel = document.getElementById("details");

            panel.replaceChildren();

            const subject = nodes.get(edge.from);
            const object = nodes.get(edge.to);

            addText(
                panel,
                "h2",
                "Relationship: " + edge.label
            );

            addText(
                panel,
                "p",
                "From: " + subject.label
            );

            addText(
                panel,
                "p",
                "To: " + object.label
            );

            let evidence = [];

            try {

                evidence = JSON.parse(
                    edge.evidence_json || "[]"
                );

            } catch (error) {

                addText(
                    panel,
                    "p",
                    "Could not read evidence data.",
                    "empty-message"
                );

                return;
            }

            addText(
                panel,
                "h3",
                "Supporting evidence: " + evidence.length
            );

            if (evidence.length === 0) {

                addText(
                    panel,
                    "p",
                    "No evidence records are attached to this relationship.",
                    "empty-message"
                );

                return;
            }

            evidence.forEach((item, index) => {

                const card = document.createElement("div");

                card.className = "evidence-card";

                addText(
                    card,
                    "h3",
                    "Evidence " + (index + 1)
                );

                addText(
                    card,
                    "div",
                    "Source: " + (item.source || "Unknown") +
                    " | Page: " + (item.page_number ?? "Unknown") +
                    " | Chunk: " + (item.chunk_id || "Unknown"),
                    "evidence-meta"
                );

                addText(
                    card,
                    "div",
                    item.evidence_text || "No passage text available.",
                    "evidence-text"
                );

                panel.appendChild(card);

            });
        }


        // Search for an entity
        function searchEntity() {

            const query = document
                .getElementById("searchBox")
                .value.trim()
                .toLowerCase();

            if (!query) {
                alert("Enter an entity name first.");
                return;
            }

            const matches = nodes.get().filter(node =>
                String(node.label || node.id)
                    .toLowerCase()
                    .includes(query)
            );

            if (matches.length === 0) {
                alert("No matching entity found.");
                return;
            }

            const match = matches[0];

            network.selectNodes([match.id]);

            network.focus(match.id, {
                scale: 1.2,
                animation: true
            });

            highlightNeighborhood(match.id);

            showEntity(match.id);

            document.getElementById("status").innerText =
                "Found: " + match.label;
        }


        // Highlight selected entity and its direct neighbors
        function highlightNeighborhood(nodeId) {

            const connected = network.getConnectedNodes(nodeId);

            const visibleIds = new Set([
                nodeId,
                ...connected
            ]);

            nodes.get().forEach(node => {

                const active = visibleIds.has(node.id);

                nodes.update({
                    id: node.id,
                    color: {
                        background: active ? "#F59E0B" : "#334155",
                        border: active ? "#FDE68A" : "#475569"
                    }
                });

            });

            edges.get().forEach(edge => {

                const active =
                    visibleIds.has(edge.from) &&
                    visibleIds.has(edge.to) &&
                    (edge.from === nodeId || edge.to === nodeId);

                edges.update({
                    id: edge.id,
                    color: {
                        color: active ? "#F59E0B" : "#334155",
                        opacity: active ? 1 : 0.2
                    },
                    width: active ? 3 : 1
                });

            });
        }


        // Restore original graph colors
        function resetGraph() {

            nodes.get().forEach(node => {

                nodes.update({
                    id: node.id,
                    color: {
                        background: "#3B82F6",
                        border: "#BFDBFE"
                    }
                });

            });

            edges.get().forEach(edge => {

                edges.update({
                    id: edge.id,
                    color: {
                        color: "#94A3B8",
                        opacity: 1
                    },
                    width: 2
                });

            });

            network.unselectAll();

            document.getElementById("status").innerText =
                "Showing complete graph.";

            const panel = document.getElementById("details");

            panel.replaceChildren();

            addText(
                panel,
                "h2",
                "Evidence Inspector"
            );

            addText(
                panel,
                "p",
                "Select a relationship to inspect its supporting passages."
            );
        }


        // Node click
        network.on("selectNode", function(params) {

            if (!params.nodes.length) return;

            const nodeId = params.nodes[0];

            highlightNeighborhood(nodeId);

            showEntity(nodeId);

            document.getElementById("status").innerText =
                "Selected entity: " + nodes.get(nodeId).label;

        });


        // Relationship click
        network.on("selectEdge", function(params) {

            if (!params.edges.length) return;

            const edge = edges.get(params.edges[0]);

            showRelationship(edge);

            document.getElementById("status").innerText =
                "Selected relationship: " + edge.label;

        });


        // Search using Enter key
        document.getElementById("searchBox")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    searchEntity();
                }

            });

    </script>
    
</body>
